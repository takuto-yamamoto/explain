<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VoiceLens — AI音声学習システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8FAFF;--surface:rgba(255,255,255,0.90);--border:rgba(37,99,235,0.12);
  --blue:#2563EB;--blue-light:#3B82F6;--blue-dark:#1D4ED8;--blue-pale:#1E40AF;
  --text:#1E293B;--muted:#475569;--dim:#94A3B8;
  --green:#059669;--amber:#D97706;--red:#DC2626;
  --font-body:'DM Sans',system-ui,sans-serif;
  --font-serif:'DM Serif Display',Georgia,serif;
  --font-mono:'JetBrains Mono',monospace;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#EFF6FF}::-webkit-scrollbar-thumb{background:rgba(37,99,235,0.25);border-radius:2px}
#app{position:relative;max-width:1200px;margin:0 auto;padding:24px 16px;z-index:1}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(37,99,235,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,0.06) 1px,transparent 1px);background-size:40px 40px;z-index:0}
.card{background:rgba(255,255,255,0.95);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 1px 8px rgba(37,99,235,0.07)}
.card-sm{background:rgba(255,255,255,0.95);border:1px solid var(--border);border-radius:12px;padding:12px 16px;box-shadow:0 1px 6px rgba(37,99,235,0.06)}
.label{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:12px;font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s ease;padding:10px 0;width:100%}
.btn-primary{background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;box-shadow:0 0 18px rgba(37,99,235,0.35)}
.btn-primary:hover:not(:disabled){box-shadow:0 0 28px rgba(37,99,235,0.6);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btn-stop{background:rgba(220,38,38,0.08);border:1px solid rgba(220,38,38,0.22);color:#DC2626}
.btn-skip{background:rgba(217,119,6,0.08);border:1px solid rgba(217,119,6,0.2);color:#D97706}
.btn-skip:disabled{opacity:.3;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.98)}
#status-pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mode-track{position:relative;display:flex;background:rgba(37,99,235,0.07);border-radius:12px;padding:4px;gap:0;border:1px solid rgba(37,99,235,0.1)}
.mode-thumb{position:absolute;top:4px;bottom:4px;width:calc(50% - 6px);border-radius:9px;background:linear-gradient(135deg,#1D4ED8,#2563EB);box-shadow:0 2px 8px rgba(37,99,235,0.4);transition:left .25s cubic-bezier(.4,0,.2,1);pointer-events:none}
.mode-btn{position:relative;flex:1;padding:7px 0;font-size:12px;font-weight:500;font-family:var(--font-body);background:none;border:none;cursor:pointer;border-radius:9px;transition:color .2s;z-index:1}
.api-input{width:100%;padding:8px 36px 8px 12px;background:#F8FAFF;border:1px solid rgba(37,99,235,0.2);border-radius:12px;color:var(--text);font-family:var(--font-mono);font-size:12px;outline:none;transition:border-color .2s}
.api-input:focus{border-color:rgba(37,99,235,0.5)}
.api-input-wrap{position:relative}
.api-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);opacity:.55;transition:opacity .2s;padding:0;line-height:0}
.api-eye:hover{opacity:1}
#drop-zone{border:2px dashed rgba(37,99,235,0.2);border-radius:16px;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s ease;padding:32px;background:rgba(239,246,255,0.5)}
#drop-zone.drag-over{border-color:rgba(37,99,235,0.5);background:rgba(219,234,254,0.4)}
#drop-zone:hover{border-color:rgba(37,99,235,0.35);background:rgba(239,246,255,0.8)}
.drop-icon{width:64px;height:64px;border-radius:16px;background:rgba(37,99,235,0.1);border:1px solid rgba(37,99,235,0.22);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
#text-panel{max-height:58vh;min-height:300px;overflow-y:auto;border-radius:16px;padding:20px;background:#FFFFFF;border:1px solid var(--border);line-height:1.9;font-size:14px;box-shadow:0 1px 8px rgba(37,99,235,0.06)}
.sentence{color:#64748B;transition:color .3s ease,background .15s;border-radius:3px;padding:1px 3px;margin-right:2px;display:inline;cursor:pointer}
.sentence:hover{background:rgba(37,99,235,0.07);color:#1E293B}
.sentence.paused{background:rgba(37,99,235,0.08);color:#1D4ED8}
.sentence.reading{color:#1D4ED8;animation:readPulse 1.2s ease-in-out infinite}
.sentence.explaining{color:#92400E;animation:explainPulse 1s ease-in-out infinite}
.sentence.annotation{color:#B0B8C4;font-size:12.5px}
.sentence.annotation:hover{background:rgba(148,163,184,0.12);color:#64748B}
.sentence.annotation::before{content:'註 ';font-size:9px;color:#CBD5E1;vertical-align:super}
.sentence.skipping{background:rgba(148,163,184,0.25);transition:background .15s}
#progress-bar-fill{height:2px;border-radius:2px;transition:width .5s ease,background .3s}
#explain-card{border-radius:16px;padding:16px;background:rgba(255,251,235,0.9);border:1px solid rgba(217,119,6,0.25);box-shadow:0 2px 8px rgba(217,119,6,0.08)}
.word-tag{display:inline-block;font-size:11px;padding:4px 9px;border-radius:8px;background:#EFF6FF;color:#3B82F6;border:1px solid rgba(37,99,235,0.18);margin:2px}
#log-inner{max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.log-row{display:flex;gap:8px;font-size:11px;align-items:baseline}
.log-time{color:var(--dim);font-family:var(--font-mono);flex-shrink:0;font-size:10px}
.wave{display:flex;align-items:flex-end;gap:3px;height:18px}
.wave-bar{width:3px;background:currentColor;border-radius:2px;transform-origin:bottom;transition:opacity .3s;transform:scaleY(.25)}
.wave-bar.active{animation:wave .8s ease-in-out infinite}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.alert-warn{background:rgba(255,251,235,0.95);border:1px solid rgba(217,119,6,0.3);color:#92400E}
.alert-err{background:rgba(254,242,242,0.95);border:1px solid rgba(220,38,38,0.3);color:#991B1B}
@keyframes readPulse{0%,100%{background:rgba(37,99,235,0.10)}50%{background:rgba(37,99,235,0.22)}}
@keyframes explainPulse{0%,100%{background:rgba(217,119,6,0.12)}50%{background:rgba(217,119,6,0.25)}}
@keyframes wave{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp .35s ease forwards}
.grid{display:grid;grid-template-columns:1fr 2fr;gap:20px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.col-left,.col-right{display:flex;flex-direction:column;gap:14px}
#file-bar{display:none}
.file-bar-inner{display:flex;align-items:center;justify-content:space-between;gap:8px}
.file-name{font-size:13px;font-weight:500;color:var(--blue-pale);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(37,99,235,0.2);color:var(--blue-light);flex-shrink:0}
.change-btn{font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;opacity:.5;transition:opacity .2s;flex-shrink:0}
.change-btn:hover{opacity:1}
#progress-section{display:none}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:#3B82F6;opacity:.8;margin-bottom:5px}
#progress-bar-track{height:2px;border-radius:2px;background:rgba(37,99,235,0.1);overflow:hidden}
.spinner{width:24px;height:24px;border:2px solid rgba(37,99,235,0.15);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
</style>
</head>
<body>

<div class="orb" style="width:520px;height:520px;background:rgba(37,99,235,0.06);top:-120px;right:-120px"></div>
<div class="orb" style="width:400px;height:400px;background:rgba(96,165,250,0.045);bottom:-80px;left:-150px"></div>

<div id="app">
  <header style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1D4ED8,#60A5FA);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
      </div>
      <div>
        <div style="font-family:var(--font-serif);font-size:20px;color:#1E293B">VoiceLens</div>
        <div style="font-size:11px;color:#3B82F6;letter-spacing:.08em">AI音声学習システム</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
    <button onclick="openSettings()" title="設定" style="width:36px;height:36px;border-radius:10px;border:1px solid rgba(37,99,235,0.18);background:rgba(255,255,255,0.85);color:#2563EB;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(37,99,235,0.08);transition:background .15s" onmouseenter="this.style.background='rgba(37,99,235,0.08)'" onmouseleave="this.style.background='rgba(255,255,255,0.85)'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div id="status-pill" style="background:rgba(255,255,255,0.9);border:1px solid rgba(37,99,235,0.15);box-shadow:0 1px 6px rgba(37,99,235,0.08)">
      <div class="dot" id="status-dot" style="background:#3B82F6;box-shadow:0 0 6px #3B82F6"></div>
      <span id="status-label" style="font-size:12px;font-weight:500;color:#2563EB">待機中</span>
      <div class="wave" id="header-wave" style="color:#3B82F6">
        <div class="wave-bar" style="height:18px;animation-delay:0s"></div>
        <div class="wave-bar" style="height:18px;animation-delay:.1s"></div>
        <div class="wave-bar" style="height:18px;animation-delay:.2s"></div>
        <div class="wave-bar" style="height:18px;animation-delay:.3s"></div>
      </div>
    </div>
    </div>
  </header>

  <!-- 設定モーダル -->
  <div id="settings-overlay" onclick="closeSettings()" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.45);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center"></div>
  <div id="settings-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1001;background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(15,23,42,0.18);width:min(480px,92vw);max-height:80vh;overflow:hidden;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 22px 16px;border-bottom:1px solid rgba(37,99,235,0.1)">
      <div style="display:flex;align-items:center;gap:9px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span style="font-size:15px;font-weight:600;color:#1E293B">設定</span>
      </div>
      <button onclick="closeSettings()" style="width:30px;height:30px;border-radius:8px;border:1px solid rgba(37,99,235,0.15);background:rgba(37,99,235,0.05);color:#64748B;cursor:pointer;display:flex;align-items:center;justify-content:center" onmouseenter="this.style.background='rgba(37,99,235,0.1)'" onmouseleave="this.style.background='rgba(37,99,235,0.05)'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div style="padding:20px 22px;overflow-y:auto">
      <div style="font-size:11px;font-weight:600;letter-spacing:.08em;color:#94A3B8;text-transform:uppercase;margin-bottom:10px">声の選択</div>
      <div id="voice-list" style="display:flex;flex-direction:column;gap:5px">
        <div style="font-size:12px;color:var(--dim)">音声を読み込み中...</div>
      </div>
    </div>
  </div>

  <div id="alert-area"></div>

  <div class="grid">
    <div class="col-left">

      <div class="card">
        <span class="label">Gemini API Key</span>
        <div class="api-input-wrap">
          <input class="api-input" type="password" id="api-key" placeholder="AIzaSy..." autocomplete="off" spellcheck="false" />
          <button class="api-eye" id="api-eye-btn" aria-label="APIキーの表示切替">
            <svg id="eye-show" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eye-hide" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div id="api-hint" style="font-size:11px;color:#3B82F6;opacity:.7;margin-top:6px">未入力でもTTS読み上げのみ動作します</div>
      </div>

      <div class="card">
        <span class="label">解説モード</span>
        <div class="mode-track">
          <div class="mode-thumb" id="mode-thumb" style="left:4px"></div>
          <button class="mode-btn" id="btn-definition" style="color:#fff" onclick="setMode('definition')">📖 定義重視</button>
          <button class="mode-btn" id="btn-analogy" style="color:var(--dim)" onclick="setMode('analogy')">💡 例え話</button>
        </div>
        <div id="mode-rebuild-hint" style="display:none;margin-top:8px;font-size:11px;color:#D97706;align-items:center;gap:6px">
          <span>モードを変更しました。</span>
          <button onclick="rebuildDictionary()" style="background:none;border:none;cursor:pointer;color:#D97706;font-size:11px;font-weight:600;padding:0;text-decoration:underline">用語辞書を再生成</button>
        </div>
      </div>

      <div class="card">
        <span class="label">コントロール</span>
        <div style="display:flex;flex-direction:column;gap:10px">
          <button class="btn btn-primary" id="btn-start" disabled onclick="handleStart()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            読み上げ開始
          </button>
          <button class="btn btn-stop" id="btn-stop" style="display:none" onclick="handleStop()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            停止
          </button>
          <button class="btn btn-skip" id="btn-skip" disabled onclick="handleSkip()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            解説スキップ
          </button>
          <div style="display:flex;align-items:center;gap:10px;padding:4px 2px">
            <span style="font-size:11px;color:var(--muted);white-space:nowrap">速度</span>
            <input type="range" id="rate-slider" min="0.5" max="2.0" step="0.1" value="1.0"
              style="flex:1;accent-color:var(--blue);cursor:pointer"
              oninput="setRate(this.value)" />
            <span id="rate-label" style="font-size:11px;font-family:var(--font-mono);color:var(--blue);min-width:28px;text-align:right">1.0×</span>
          </div>
          <label style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px;cursor:pointer">
            <span style="font-size:11px;color:var(--muted)">サイド注釈・脚注をスキップ</span>
            <input type="checkbox" id="skip-annotations-toggle" checked
              style="accent-color:var(--blue);cursor:pointer;width:15px;height:15px"
              onchange="setSkipAnnotations(this.checked)" />
          </label>
          <div id="annotation-count-hint" style="display:none;font-size:10px;color:var(--dim);padding:0 2px;margin-top:-4px"></div>
        </div>
      </div>

      <div id="explain-card" style="display:none"></div>

      <div class="card" id="words-card" style="display:none">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <span class="label" style="margin-bottom:0">解説済み単語</span>
          <span class="badge" id="words-count">0語</span>
        </div>
        <div id="words-list"></div>
      </div>

    </div>

    <div class="col-right">

      <div id="drop-zone" role="button" tabindex="0" aria-label="PDFをアップロード"
        onkeydown="if(event.key==='Enter')document.getElementById('file-input').click()">
        <input type="file" id="file-input" accept="application/pdf,.pdf" style="display:none" />
        <div id="drop-idle" style="display:flex;flex-direction:column;align-items:center;text-align:center">
          <div class="drop-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          </div>

<script type="module">
// ── STATE ──────────────────────────────────────────────────────────────────
// sentences の各要素: { text: string, type: 'body' | 'annotation', source: 'layout' | 'ai' }
let sentences    = []
let currentMode  = 'definition'
let currentRate  = 1.0
let speechState  = 'idle'
let currentIdx   = -1
let explainedWords = new Set()
let abortFlag    = false
let isLoopRunning = false
let keepAliveTimer = null
let fetchAbortCtrl = null
let pdfjsLib     = null
// 一括抽出した用語辞書 { "専門用語": "解説文", ... }
let termDictionary = {}
let selectedVoice  = null   // SpeechSynthesisVoice | null
let skipAnnotations = true  // 注釈（サイド注釈・脚注など）の読み上げをスキップするか

// ── PDF.JS LOADER ──────────────────────────────────────────────────────────
// We import dynamically to avoid the <script type="module"> tag conflicting
// with our own module scope. Cached in module-local variable.
async function getPdfJs() {
  if (pdfjsLib) return pdfjsLib
  const mod = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs')
  mod.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs'
  pdfjsLib = mod
  return mod
}

// カラム（段組み）検出のしきい値
const COLUMN_GAP_RATIO = 0.06   // ページ幅に対し、この比率以上の空白ギャップでカラム境界とみなす
const ASIDE_WIDTH_RATIO = 0.34  // ページ幅に対し、この比率以下の幅しかないカラムは「サイド注釈」候補とみなす

async function extractTextFromPDF(file, onProgress) {
  const lib = await getPdfJs()
  const buf = await file.arrayBuffer()
  const pdf = await lib.getDocument({
    data: buf,
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/cmaps/',
    cMapPacked: true,
  }).promise

  const pageCount = pdf.numPages
  let fullText = ''
  // レイアウト由来の暫定分類が付いた文の配列 { text, isAside }
  const layoutSentences = []

  for (let p = 1; p <= pageCount; p++) {
    onProgress?.(p, pageCount)
    const page = await pdf.getPage(p)
    const tc   = await page.getTextContent()
    const viewport = page.getViewport({ scale: 1 })
    const pageWidth = viewport.width || 1

    const items = tc.items.filter(it => 'str' in it && it.str.trim())
    if (!items.length) continue

    // ── カラム検出: x座標のヒストグラムから縦方向の空白帯（ギャップ）を見つける ──
    const columns = detectColumns(items, pageWidth)

    // 各テキストアイテムをカラムに割り当て、カラムごとに行を再構成
    for (const col of columns) {
      const colItems = items
        .filter(it => {
          const cx = it.transform[4] + (it.width || 0) / 2
          return cx >= col.x0 && cx < col.x1
        })
        .sort((a, b) => {
          const dy = b.transform[5] - a.transform[5]
          if (Math.abs(dy) > 4) return dy
          return a.transform[4] - b.transform[4]
        })
      if (!colItems.length) continue

      const lines = []
      let cur = [], lastY = null
      for (const it of colItems) {
        const y = Math.round(it.transform[5])
        if (lastY !== null && Math.abs(y - lastY) > 4) {
          if (cur.length) { lines.push(cur.map(x => x.str).join(' ').replace(/\s+/g,' ').trim()); cur = [] }
        }
        cur.push(it); lastY = y
      }
      if (cur.length) lines.push(cur.map(x => x.str).join(' ').replace(/\s+/g,' ').trim())

      const colText = lines.filter(Boolean).join('\n')
      fullText += colText + '\n\n'

      // このカラムが「狭いカラム」かどうかでサイド注釈候補かを暫定判定
      // （クリック領域として広げたwidthではなく、実際の文字幅contentWidthで判定）
      const isAsideCol = col.contentWidth / pageWidth <= ASIDE_WIDTH_RATIO
      const colSentences = splitSentences(colText)
      for (const s of colSentences) layoutSentences.push({ text: s, isAside: isAsideCol })
    }
  }
  return { sentences: layoutSentences, fullText, pageCount }
}

// x座標の被覆区間から「縦の空白帯」を検出してカラムに分割する簡易ロジック
// クリック領域・行再構成には中間点まで広げた範囲(x0〜x1)を使うが、
// 「狭いカラムか」の判定には実際に文字が存在する幅(contentWidth)を使う
// （中間点まで広げると余白がカラムの見かけ幅を太らせてしまうため）
function detectColumns(items, pageWidth) {
  const spans = items
    .map(it => ({ x0: it.transform[4], x1: it.transform[4] + (it.width || 0) }))
    .sort((a, b) => a.x0 - b.x0)
  if (!spans.length) return [{ x0: 0, x1: pageWidth, width: pageWidth, contentWidth: pageWidth }]

  // 被覆区間をマージして「文字が存在するx範囲」の塊を求める
  const merged = [spans[0]]
  for (const s of spans.slice(1)) {
    const last = merged[merged.length - 1]
    if (s.x0 - last.x1 > pageWidth * COLUMN_GAP_RATIO) {
      merged.push({ ...s })
    } else {
      last.x1 = Math.max(last.x1, s.x1)
    }
  }

  // ギャップで仕切られた塊をそのままカラムとする（境界は塊の中間点）
  const columns = merged.map((m, i) => {
    const x0 = i === 0 ? 0 : (merged[i - 1].x1 + m.x0) / 2
    const x1 = i === merged.length - 1 ? pageWidth : (m.x1 + merged[i + 1].x0) / 2
    return { x0, x1, width: x1 - x0, contentWidth: m.x1 - m.x0 }
  })
  return columns
}

function splitSentences(text) {
  const result = []
  for (const para of text.split(/\n{2,}/)) {
    if (!para.trim()) continue
    // Split on Japanese sentence-end punctuation
    let s = para.replace(/([。！？])\s*/g, '$1\n')
    // Split on English sentence ends — but NOT on decimals or known abbreviations
    s = s.replace(
      /(?<![0-9])(?<!e\.g)(?<!i\.e)(?<!etc)(?<!Mr)(?<!Dr)(?<!vs)(?<!\.\.)\.[ \t]+(?=[A-Z\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF])/g,
      '.\n'
    )
    s = s.replace(/([!?])[ \t]+(?=[A-Z\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF])/g, '$1\n')
    const parts = s.split('\n')
      .map(x => x.trim())
      .filter(x => x.length >= 4 && !/^[\d\s.]+$/.test(x))
    result.push(...parts)
  }
  return result
}

// ── SPEECH ENGINE ──────────────────────────────────────────────────────────
function cancelSpeech() { window.speechSynthesis.cancel() }

let keepAliveNudging = false

function startKeepAlive() {
  stopKeepAlive()
  // Chrome stops speaking silently after ~15s; nudge it every 10s
  keepAliveTimer = setInterval(() => {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
      keepAliveNudging = true
      window.speechSynthesis.pause()
      window.speechSynthesis.resume()
      // Reset flag after a short delay to allow any spurious events to settle
      setTimeout(() => { keepAliveNudging = false }, 100)
    }
  }, 10000)
}
function stopKeepAlive() {
  if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null }
}

function speakText(text, rate = 1.0) {
  return new Promise((resolve, reject) => {
    if (abortFlag) { reject(new Error('aborted')); return }
    // Cancel any current speech before queuing new one
    cancelSpeech()
    const u = new SpeechSynthesisUtterance(text)
    u.lang = 'ja-JP'; u.rate = rate; u.pitch = 1.0; u.volume = 1.0
    if (selectedVoice) u.voice = selectedVoice
    // Guard against onend/onerror both firing (browser quirk)
    let settled = false
    const done = (fn, v) => { if (settled) return; settled = true; fn(v) }
    u.onend   = () => { if (!keepAliveNudging) done(resolve, undefined) }
    u.onerror = e  => {
      if (e.error === 'interrupted' || e.error === 'canceled') {
        done(resolve, undefined)
      } else {
        done(reject, new Error(e.error ?? 'speech-error'))
      }
    }
    window.speechSynthesis.speak(u)
  })
}

// ── 一括用語抽出 + 本文/注釈分類 ─────────────────────────────────────────────
// テキスト全体を1回のAPI呼び出しで分析し、用語辞書と「注釈文インデックス」を
// 同時に構築する（呼び出し回数を増やさず無料枠を節約するため）
const MAX_CHARS = 12000
// 文番号付きテキストとして送る際、1文あたり何文字までを目安にするか（API送信量の目安）
const MAX_SENT_CHARS = 8000

async function fetchTermDictionary(sentenceObjs, fullText, apiKey) {
  const modeStr = currentMode === 'definition'
    ? '簡潔な定義重視（各用語を1〜2文で正確に定義してください）'
    : '直感的な例え話重視（各用語を身近な例えを使って2文以内で説明してください）'

  // テキストが長すぎる場合は先頭から切り出す（用語抽出用）
  const text = fullText.length > MAX_CHARS
    ? fullText.slice(0, MAX_CHARS) + '\n…（以下省略）'
    : fullText

  // 番号付きリストとして文を渡す（本文/注釈分類用）。長すぎる場合は先頭から切り詰め
  let numberedLines = sentenceObjs.map((s, i) => `${i}: ${s.text}`).join('\n')
  if (numberedLines.length > MAX_SENT_CHARS) {
    numberedLines = numberedLines.slice(0, MAX_SENT_CHARS) + '\n…（以下省略）'
  }

  const sys = `あなたは専門教材の解説補助AIです。与えられたテキストを読み、以下の2つのタスクを同時に行ってください。
タスク1: 重要な専門用語を10〜30語程度抽出し、指定されたモード（${modeStr}）に応じて各用語の解説を生成する。ハルシネーション抑制のため、テキストに存在しない用語の創作は厳禁です。
タスク2: 番号付きの文リストを読み、各文が「本文（主たる論理展開）」か「注釈（サイドバーのワンポイント解説・脚注・図表キャプション内の補足・手書きメモなど、本筋から外れた補足情報）」かを判定し、注釈と判定した文の番号のみを配列で返す。
レスポンスはJSONオブジェクトのみとし、前後の説明・マークダウンコードブロックは一切不要です。`
  const usr = `■専門用語抽出用テキスト:\n${text}\n\n■本文/注釈分類用の番号付き文リスト:\n${numberedLines}\n\nレスポンス形式（JSONオブジェクトのみ、他のテキスト不要）:\n{"terms":{"専門用語1":"解説文1","専門用語2":"解説文2"},"annotationIndices":[番号, 番号, ...]}`

  const ctrl = new AbortController()
  fetchAbortCtrl = ctrl
  const poll = setInterval(() => { if (abortFlag) ctrl.abort() }, 80)

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: ctrl.signal,
        body: JSON.stringify({
          system_instruction: { parts: [{ text: sys }] },
          contents: [{ role: 'user', parts: [{ text: usr }] }],
          generationConfig: { temperature: 0.2, maxOutputTokens: 4096, responseMimeType: 'application/json' },
        }),
      }
    )

    if (res.status === 429) {
      throw new Error('API制限(429): しばらく待ってから再度PDFをアップロードしてください')
    }
    if (!res.ok) {
      const t = await res.text().catch(() => '')
      throw new Error(`HTTP ${res.status}: ${t.slice(0, 120)}`)
    }

    const data  = await res.json()
    const raw   = data.candidates?.[0]?.content?.parts?.[0]?.text ?? '{}'
    const clean = raw.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim()

    return parseTermDictionaryResponse(clean)
  } catch (e) {
    if (e.name === 'AbortError') return { terms: {}, annotationIndices: null }
    throw e  // 呼び出し元でハンドリング
  } finally {
    clearInterval(poll)
    fetchAbortCtrl = null
  }
}

function parseTermDictionaryResponse(clean) {
  let parsed
  try { parsed = JSON.parse(clean) }
  catch {
    const m = clean.match(/\{[\s\S]*\}/)
    if (m) { try { parsed = JSON.parse(m[0]) } catch { parsed = null } }
  }
  if (!parsed || typeof parsed !== 'object') return { terms: {}, annotationIndices: null }

  // 新形式 { terms, annotationIndices } を期待するが、
  // 万一フラットな旧形式 { 用語: 解説, ... } が返ってきた場合のフォールバックも用意
  if (parsed.terms && typeof parsed.terms === 'object') {
    const annotationIndices = Array.isArray(parsed.annotationIndices)
      ? parsed.annotationIndices.filter(n => Number.isInteger(n))
      : null
    return { terms: parsed.terms, annotationIndices }
  }
  return { terms: parsed, annotationIndices: null }
}

async function runLoop(resumeFrom = 0) {
  if (isLoopRunning) return
  isLoopRunning = true
  abortFlag = false
  startKeepAlive()

  try {
    for (let i = resumeFrom; i < sentences.length; i++) {
      if (abortFlag) break
      const item = sentences[i]
      const sentence = item.text
      if (!sentence.trim()) continue

      // 注釈と判定された文は、設定がONならスキップ（読み上げず一瞬だけハイライトして通過）
      if (item.type === 'annotation' && skipAnnotations) {
        highlightSentence(i, true)
        continue
      }

      setSpeechState('reading')
      highlightSentence(i)

      try { await speakText(sentence, currentRate) }
      catch (e) {
        if (e.message === 'aborted') break
        addLog('⚠ 音声エラー: ' + e.message)
        showAlert('音声読み上げでエラーが発生しました。ブラウザをリロードしてお試しください。', 'warn')
      }
      if (abortFlag) break

      // 辞書から未解説の用語を部分一致で探す（1文に複数あれば最初の1つ）
      let matchedTerm = null
      let matchedExplanation = null
      for (const [term, explanation] of Object.entries(termDictionary)) {
        if (!explainedWords.has(term) && sentence.includes(term)) {
          matchedTerm = term
          matchedExplanation = explanation
          break
        }
      }

      if (matchedTerm && matchedExplanation) {
        explainedWords.add(matchedTerm)
        addWordTag(matchedTerm)
        setSpeechState('explaining')
        showExplainCard(matchedTerm, matchedExplanation)
        try { await speakText(`「${matchedTerm}」とは、${matchedExplanation}`, Math.min(currentRate, 0.92)) }
        catch { /* cancelled by skip — ok */ }
        if (abortFlag) break
        hideExplainCard()
        setSpeechState('reading')
      }
    }
  } finally {
    isLoopRunning = false
    stopKeepAlive()
    if (!abortFlag) {
      if (sentences.length > 0) updateProgress(sentences.length - 1, true)
      setSpeechState('idle')
      highlightSentence(-1)
      hideExplainCard()
      addLog('✅ 読み上げ完了')
    }
  }
}

// ── UI HELPERS ─────────────────────────────────────────────────────────────
const STATUS_CFG = {
  idle:      { label: '待機中',     color: '#2563EB', dot: '#3B82F6' },
  reading:   { label: '読み上げ中', color: '#059669', dot: '#10B981' },
  explaining:{ label: 'AI解説中',  color: '#D97706', dot: '#F59E0B' },
}

function setSpeechState(s) {
  speechState = s
  const c = STATUS_CFG[s] ?? STATUS_CFG.idle
  const lbl  = document.getElementById('status-label')
  const dot  = document.getElementById('status-dot')
  const wave = document.getElementById('header-wave')

  lbl.textContent   = c.label
  lbl.style.color   = c.color
  dot.style.background  = c.dot
  dot.style.boxShadow   = `0 0 6px ${c.dot}`
  wave.style.color      = c.dot

  const isActive = s === 'reading' || s === 'explaining'
  wave.querySelectorAll('.wave-bar').forEach(b => {
    b.style.opacity = isActive ? '1' : '0.2'
    if (isActive) b.classList.add('active'); else b.classList.remove('active')
  })

  const startBtn = document.getElementById('btn-start')
  const stopBtn  = document.getElementById('btn-stop')
  const skipBtn  = document.getElementById('btn-skip')

  if (isActive) {
    startBtn.style.display = 'none'
    stopBtn.style.display  = 'flex'
  } else {
    startBtn.style.display = 'flex'
    stopBtn.style.display  = 'none'
    startBtn.disabled = sentences.length === 0
  }
  skipBtn.disabled = s !== 'explaining'

  document.getElementById('progress-bar-fill').style.background =
    s === 'explaining'
      ? 'linear-gradient(90deg,#B45309,#D97706)'
      : 'linear-gradient(90deg,#1D4ED8,#60A5FA)'
}

function highlightSentence(idx, isSkipping = false) {
  currentIdx = idx
  document.querySelectorAll('#text-panel .sentence').forEach(el => {
    el.classList.remove('reading', 'explaining', 'paused', 'skipping')
    if (parseInt(el.dataset.idx) === idx) {
      // Always set 'reading' here; showExplainCard will switch to 'explaining' when needed
      el.classList.add(isSkipping ? 'skipping' : 'reading')
      el.scrollIntoView({ behavior: 'smooth', block: 'center' })
    }
  })
  if (idx >= 0) updateProgress(idx, false)
}

function updateProgress(idx, done) {
  if (sentences.length === 0) return
  const pct = done ? 100 : Math.round(((idx + 1) / sentences.length) * 100)
  document.getElementById('progress-bar-fill').style.width = pct + '%'
  document.getElementById('prog-label').textContent =
    done ? `${sentences.length} / ${sentences.length} 文` : `${idx + 1} / ${sentences.length} 文`
  document.getElementById('prog-pct').textContent = pct + '%'
}

function showExplainCard(term, body) {
  const card = document.getElementById('explain-card')
  // Use textContent (not innerHTML) to prevent XSS
  card.innerHTML = ''
  const header = document.createElement('div')
  header.style.cssText = 'display:flex;align-items:center;gap:7px;margin-bottom:8px'
  const dotEl = document.createElement('div')
  dotEl.className = 'dot'
  dotEl.style.cssText = 'background:#D97706;box-shadow:0 0 5px rgba(217,119,6,0.4)'
  const lbl = document.createElement('span')
  lbl.style.cssText = 'font-size:11px;font-weight:500;color:#D97706'
  lbl.textContent = 'AI解説中'
  header.append(dotEl, lbl)
  const termEl = document.createElement('div')
  termEl.style.cssText = 'font-size:14px;font-weight:600;color:#92400E;margin-bottom:5px'
  termEl.textContent = `「${term}」`
  const bodyEl = document.createElement('div')
  bodyEl.style.cssText = 'font-size:12px;color:#78350F;opacity:.9;line-height:1.6'
  bodyEl.textContent = body
  card.append(header, termEl, bodyEl)
  card.style.display = 'block'
  card.classList.remove('fade-up')
  void card.offsetWidth  // reflow to restart animation
  card.classList.add('fade-up')

  // Switch already-highlighted sentence to explaining color
  document.querySelectorAll('#text-panel .sentence').forEach(el => {
    if (parseInt(el.dataset.idx) === currentIdx) {
      el.classList.remove('reading'); el.classList.add('explaining')
    }
  })
}

function hideExplainCard() {
  const card = document.getElementById('explain-card')
  card.style.display = 'none'
  card.classList.remove('fade-up')
}

function addWordTag(word) {
  const list = document.getElementById('words-list')
  const tag  = document.createElement('span')
  tag.className   = 'word-tag'
  tag.textContent = word   // textContent — no XSS risk
  list.appendChild(tag)
  document.getElementById('words-card').style.display = 'block'
  document.getElementById('words-count').textContent  =
    list.querySelectorAll('.word-tag').length + '語'
}

// FIXED: use textContent for user-derived strings to prevent XSS
function addLog(msg) {
  const now   = new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
  const inner = document.getElementById('log-inner')
  const row   = document.createElement('div')
  row.className = 'log-row'
  const timeEl = document.createElement('span')
  timeEl.className   = 'log-time'
  timeEl.textContent = now
  const msgEl  = document.createElement('span')
  msgEl.style.color  = 'var(--text)'
  msgEl.textContent  = msg   // safe: no innerHTML
  row.append(timeEl, msgEl)
  inner.insertBefore(row, inner.firstChild)
  // Dim older entries
  inner.querySelectorAll('.log-row span:last-child').forEach((el, i) => {
    el.style.color = i === 0 ? 'var(--text)' : 'var(--dim)'
  })
  while (inner.children.length > 40) inner.removeChild(inner.lastChild)
  document.getElementById('log-card').style.display = 'block'
}

function clearLog() {
  document.getElementById('log-inner').innerHTML = ''
  document.getElementById('log-card').style.display = 'none'
}

// FIXED: check node still exists before removing on timeout
function showAlert(msg, type = 'warn') {
  const area = document.getElementById('alert-area')
  const div  = document.createElement('div')
  div.className = `alert alert-${type} fade-up`
  const msgEl = document.createElement('span')
  msgEl.textContent = msg
  const closeBtn = document.createElement('button')
  closeBtn.textContent = '✕'
  closeBtn.style.cssText = 'background:none;border:none;cursor:pointer;color:inherit;font-size:14px;opacity:.7'
  closeBtn.onclick = () => { if (div.parentNode) div.remove(); updateAlertMargin() }
  div.append(msgEl, closeBtn)
  area.appendChild(div)
  updateAlertMargin()
  setTimeout(() => { if (div.parentNode) div.remove(); updateAlertMargin() }, 6000)
}

function updateAlertMargin() {
  const area = document.getElementById('alert-area')
  area.style.marginBottom = area.children.length ? '14px' : '0'
}

function renderTextPanel() {
  const panel = document.getElementById('text-panel')
  panel.innerHTML = ''
  const frag = document.createDocumentFragment()
  sentences.forEach((item, i) => {
    const span = document.createElement('span')
    span.className   = item.type === 'annotation' ? 'sentence annotation' : 'sentence'
    span.dataset.idx = i
    span.textContent = item.text + ' '
    span.title = item.type === 'annotation'
      ? 'クリックしてここから開始（注釈と判定された文）'
      : 'クリックしてここから開始'
    span.addEventListener('click', () => seekTo(i))
    frag.appendChild(span)
  })
  panel.appendChild(frag)
  updateAnnotationHint()
}

async function seekTo(idx) {
  // 読み上げ中なら止める
  if (isLoopRunning) await stopLoop()
  stopKeepAlive()
  cancelSpeech()

  // 全文のハイライトをリセットして、選択文を paused 表示
  document.querySelectorAll('#text-panel .sentence').forEach(el => {
    el.classList.remove('reading', 'explaining', 'paused')
  })
  currentIdx = idx
  const target = document.querySelector(`#text-panel .sentence[data-idx="${idx}"]`)
  if (target) {
    target.classList.add('paused')
    target.scrollIntoView({ behavior: 'smooth', block: 'center' })
  }
  updateProgress(idx, false)
  setSpeechState('idle')
  hideExplainCard()
  addLog(`📍 ${idx + 1}文目を選択 — 開始ボタンでここから再開`)
}

// ── EVENT HANDLERS ─────────────────────────────────────────────────────────
window.openSettings = function() {
  document.getElementById('settings-overlay').style.display = 'block'
  document.getElementById('settings-modal').style.display = 'flex'
}
window.closeSettings = function() {
  document.getElementById('settings-overlay').style.display = 'none'
  document.getElementById('settings-modal').style.display = 'none'
}
// ESCキーで閉じる
document.addEventListener('keydown', e => { if (e.key === 'Escape') window.closeSettings() })

window.setRate = function(v) {
  currentRate = parseFloat(v)
  document.getElementById('rate-label').textContent = currentRate.toFixed(1) + '×'
}

window.setSkipAnnotations = function(checked) {
  skipAnnotations = checked
  addLog(checked ? '🔇 注釈の読み上げをスキップします' : '🔊 注釈も読み上げます')
}

function updateAnnotationHint() {
  const hint = document.getElementById('annotation-count-hint')
  if (!hint) return
  const count = sentences.filter(s => s.type === 'annotation').length
  if (count > 0) {
    hint.textContent = `注釈と判定された文: ${count} / ${sentences.length}文`
    hint.style.display = 'block'
  } else {
    hint.style.display = 'none'
  }
}

// ── VOICE SELECTOR ─────────────────────────────────────────────────────────
function buildVoiceList() {
  const voices = window.speechSynthesis.getVoices()
  if (!voices.length) return

  // 日本語音声を優先、次いでその他
  const jaVoices  = voices.filter(v => v.lang.startsWith('ja'))
  const otherVoices = voices.filter(v => !v.lang.startsWith('ja'))
  const sorted = [...jaVoices, ...otherVoices]

  const list = document.getElementById('voice-list')
  list.innerHTML = ''

  sorted.forEach((voice, i) => {
    const isJa = voice.lang.startsWith('ja')
    const row = document.createElement('div')
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;cursor:pointer;transition:background .15s;border:1px solid transparent'
    row.dataset.voiceName = voice.name

    const radio = document.createElement('div')
    radio.className = 'voice-radio'
    radio.dataset.voiceName = voice.name
    radio.style.cssText = 'width:14px;height:14px;border-radius:50%;border:2px solid rgba(37,99,235,0.3);flex-shrink:0;transition:all .15s;background:#fff'

    const label = document.createElement('div')
    label.style.cssText = 'flex:1;min-width:0'
    label.innerHTML = `<div style="font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${voice.name}</div>
      <div style="font-size:10px;color:var(--dim)">${voice.lang}${voice.localService ? ' · ローカル' : ' · オンライン'}${isJa ? '' : ''}</div>`

    const playBtn = document.createElement('button')
    playBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`
    playBtn.style.cssText = 'width:26px;height:26px;border-radius:7px;border:1px solid rgba(37,99,235,0.2);background:rgba(37,99,235,0.07);color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s'
    playBtn.title = 'サンプル再生'
    playBtn.addEventListener('mouseenter', () => playBtn.style.background = 'rgba(37,99,235,0.15)')
    playBtn.addEventListener('mouseleave', () => playBtn.style.background = 'rgba(37,99,235,0.07)')
    playBtn.addEventListener('click', e => {
      e.stopPropagation()
      previewVoice(voice, playBtn)
    })

    row.appendChild(radio)
    row.appendChild(label)
    row.appendChild(playBtn)

    row.addEventListener('mouseenter', () => { if (!row.classList.contains('selected')) row.style.background = 'rgba(37,99,235,0.05)' })
    row.addEventListener('mouseleave', () => { if (!row.classList.contains('selected')) row.style.background = '' })
    row.addEventListener('click', () => selectVoice(voice))

    list.appendChild(row)

    // 最初の日本語音声をデフォルト選択
    if (i === 0) selectVoice(voice)
  })
}

function selectVoice(voice) {
  selectedVoice = voice
  document.querySelectorAll('#voice-list [data-voice-name]').forEach(row => {
    const isSelected = row.dataset.voiceName === voice.name
    const radio = row.querySelector('.voice-radio')
    row.classList.toggle('selected', isSelected)
    row.style.background = isSelected ? 'rgba(37,99,235,0.08)' : ''
    row.style.borderColor = isSelected ? 'rgba(37,99,235,0.22)' : 'transparent'
    if (radio) {
      radio.style.background = isSelected ? 'var(--blue)' : '#fff'
      radio.style.borderColor = isSelected ? 'var(--blue)' : 'rgba(37,99,235,0.3)'
      radio.style.boxShadow = isSelected ? '0 0 0 3px rgba(37,99,235,0.15)' : 'none'
    }
  })
}

let previewUtterance = null
function previewVoice(voice, btn) {
  window.speechSynthesis.cancel()
  const u = new SpeechSynthesisUtterance('こんにちは。この声でテキストを読み上げます。')
  u.voice = voice; u.lang = voice.lang.startsWith('ja') ? 'ja-JP' : voice.lang
  u.rate = currentRate; u.pitch = 1.0; u.volume = 1.0
  const origHTML = btn.innerHTML
  btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>`
  u.onend = u.onerror = () => { btn.innerHTML = origHTML }
  window.speechSynthesis.speak(u)
}

// 音声リストは非同期で読み込まれる場合がある（Chrome）
window.speechSynthesis.onvoiceschanged = buildVoiceList
buildVoiceList()  // Safari / Firefox は即時利用可能

window.setMode = function(m) {
  const prevMode = currentMode
  currentMode = m
  const thumb  = document.getElementById('mode-thumb')
  const btnDef = document.getElementById('btn-definition')
  const btnAna = document.getElementById('btn-analogy')
  // thumb left: 4px for left option, calc(50% + 2px) for right (accounts for padding:4px on track)
  thumb.style.left = m === 'definition' ? '4px' : 'calc(50% + 2px)'
  btnDef.style.color = m === 'definition' ? '#fff' : 'var(--dim)'
  btnAna.style.color = m === 'analogy'    ? '#fff' : 'var(--dim)'

  // Show rebuild hint if dictionary already exists and mode actually changed
  const hint = document.getElementById('mode-rebuild-hint')
  const hasDictionary = Object.keys(termDictionary).length > 0
  if (hint) {
    hint.style.display = (hasDictionary && prevMode !== m) ? 'flex' : 'none'
  }
}

window.rebuildDictionary = async function() {
  const apiKey = document.getElementById('api-key').value.trim()
  if (!apiKey) { showAlert('APIキーを入力してください', 'warn'); return }
  if (sentences.length === 0) return
  const hint = document.getElementById('mode-rebuild-hint')
  if (hint) hint.style.display = 'none'

  addLog('🔄 用語辞書を再生成中...')
  // Re-assemble fullText from sentences for rebuild
  const fullText = sentences.map(s => s.text).join('\n')
  try {
    const { terms, annotationIndices } = await fetchTermDictionary(sentences, fullText, apiKey)
    termDictionary = terms
    explainedWords = new Set()  // reset so re-explained with new mode
    document.getElementById('words-list').innerHTML = ''
    document.getElementById('words-card').style.display = 'none'

    if (annotationIndices) {
      // 注釈分類は用語モードに左右されない判定なので、再生成時も上書き反映する
      sentences.forEach(s => { if (s.source === 'ai') { s.type = 'body'; s.source = 'layout' } })
      let aiCount = 0
      for (const idx of annotationIndices) {
        if (sentences[idx]) { sentences[idx].type = 'annotation'; sentences[idx].source = 'ai'; aiCount++ }
      }
      renderTextPanel()
    }

    const termCount = Object.keys(termDictionary).length
    addLog(`📚 用語辞書再構築完了: ${termCount}語`)
  } catch (e) {
    showAlert('再生成エラー: ' + e.message, 'warn')
  }
}

// ループ停止を確実に待つ共通ヘルパー（Promise版）
function stopLoop() {
  return new Promise(resolve => {
    if (!isLoopRunning) { resolve(); return }
    abortFlag = true
    cancelSpeech()
    fetchAbortCtrl?.abort()
    const t = setInterval(() => {
      if (!isLoopRunning) { clearInterval(t); resolve() }
    }, 50)
  })
}

window.handleStart = async function() {
  if (sentences.length === 0) return
  if (!('speechSynthesis' in window)) {
    showAlert('このブラウザはWeb Speech APIに対応していません（Chrome/Edgeを使用してください）', 'err')
    return
  }
  if (isLoopRunning) {
    await stopLoop()
    // 再スタート時は解説済み単語をリセットしない（同じ文章の続きとして扱う）
  }
  // currentIdx が途中なら、その文から再開（最初から読む場合は 0）
  const resumeFrom = currentIdx >= 0 && currentIdx < sentences.length ? currentIdx : 0
  addLog(resumeFrom > 0 ? `▶ ${resumeFrom + 1}文目から再開` : '▶ 読み上げ開始')
  runLoop(resumeFrom)
}

window.handleStop = async function() {
  const pausedAt = currentIdx  // 停止位置を保存
  await stopLoop()
  stopKeepAlive()
  setSpeechState('idle')
  // currentIdx をリセットせず、停止位置のハイライトを維持
  currentIdx = pausedAt
  // ハイライトを reading ではなく passive スタイルに切り替え
  document.querySelectorAll('#text-panel .sentence').forEach(el => {
    el.classList.remove('reading', 'explaining')
    if (parseInt(el.dataset.idx) === pausedAt) el.classList.add('paused')
  })
  hideExplainCard()
  addLog(`⏹ ${pausedAt >= 0 ? pausedAt + 1 + '文目で停止' : '停止'}`)
}

window.handleSkip = function() {
  if (speechState === 'explaining') {
    cancelSpeech()
    addLog('⏭ 解説スキップ')
  }
}

window.resetPDF = async function() {
  await stopLoop()
  stopKeepAlive()
  setSpeechState('idle')
  hideExplainCard()
  sentences = []
  document.getElementById('drop-zone').style.display = 'flex'
  document.getElementById('file-bar').style.display = 'none'
  document.getElementById('text-panel').style.display = 'none'
  document.getElementById('progress-section').style.display = 'none'
  document.getElementById('progress-bar-fill').style.width = '0%'
  document.getElementById('prog-label').textContent = '0 / 0 文'
  document.getElementById('prog-pct').textContent = '0%'
  document.getElementById('file-input').value = ''
  document.getElementById('annotation-count-hint').style.display = 'none'
  clearLog()
  resetWordState()
  resetDropZone()
}

function resetWordState() {
  explainedWords = new Set()
  termDictionary = {}
  document.getElementById('words-list').innerHTML = ''
  document.getElementById('words-card').style.display = 'none'
  hideExplainCard()
}

window.clearLog = clearLog

// ── API KEY ────────────────────────────────────────────────────────────────
document.getElementById('api-eye-btn').addEventListener('click', () => {
  const inp    = document.getElementById('api-key')
  const isPass = inp.type === 'password'
  inp.type = isPass ? 'text' : 'password'
  document.getElementById('eye-show').style.display = isPass ? 'none'  : 'block'
  document.getElementById('eye-hide').style.display = isPass ? 'block' : 'none'
})

document.getElementById('api-key').addEventListener('input', e => {
  e.target.style.borderColor = e.target.value ? 'rgba(37,99,235,0.4)' : 'rgba(37,99,235,0.2)'
  document.getElementById('api-hint').style.opacity = e.target.value ? '0' : '.7'
})

// Restore key from sessionStorage (clears on tab close — key never touches localStorage)
const savedKey = sessionStorage.getItem('vl_key')
if (savedKey) {
  const inp = document.getElementById('api-key')
  inp.value = savedKey
  inp.style.borderColor = 'rgba(37,99,235,0.4)'
  document.getElementById('api-hint').style.opacity = '0'
}
document.getElementById('api-key').addEventListener('change', e => {
  if (e.target.value) sessionStorage.setItem('vl_key', e.target.value)
  else sessionStorage.removeItem('vl_key')
})

// ── DRAG & DROP ────────────────────────────────────────────────────────────
const dropZone = document.getElementById('drop-zone')
dropZone.addEventListener('click', () => document.getElementById('file-input').click())
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over') })
dropZone.addEventListener('dragleave', e => { if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('drag-over') })
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); processFile(e.dataTransfer.files[0]) })
document.getElementById('file-input').addEventListener('change', e => {
  processFile(e.target.files[0]); e.target.value = ''
})

async function processFile(file) {
  if (!file) return
  const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')
  if (!isPdf) { showAlert('PDFファイルのみ対応しています', 'warn'); return }

  const dz = document.getElementById('drop-zone')
  document.getElementById('drop-idle').style.display    = 'none'
  document.getElementById('drop-loading').style.display = 'flex'
  document.getElementById('drop-fname').textContent     = file.name
  dz.style.cursor = 'default'
  dz.style.pointerEvents = 'none'

  try {
    // ── フェーズ1: テキスト抽出 ──────────────────────────────────────────
    const { sentences: parsed, fullText, pageCount } = await extractTextFromPDF(file, (cur, total) => {
      const pct = Math.round((cur / total) * 100)
      document.getElementById('drop-prog-fill').style.width   = pct + '%'
      document.getElementById('drop-prog-label').textContent  = `テキスト抽出中... ${pct}%`
    })

    if (parsed.length === 0) {
      showAlert('テキストを抽出できませんでした（スキャンPDFは非対応です）', 'warn')
      resetDropZone(); return
    }

    // レイアウト由来の暫定判定を type/source 付きの正式な形に変換
    // （狭いカラム = サイド注釈の可能性が高い、という簡易ヒューリスティック）
    sentences = parsed.map(s => ({
      text: s.text,
      type: s.isAside ? 'annotation' : 'body',
      source: 'layout',
    }))
    renderTextPanel()

    // ── フェーズ2: AI一括分析（APIキーがある場合のみ） ──────────────────
    // 用語辞書の生成と「本文/注釈」分類を同じ1回のAPI呼び出しにまとめることで
    // 無料枠の消費を抑える（呼び出し回数を増やさない）
    const apiKey = document.getElementById('api-key').value.trim()
    termDictionary = {}  // 前回分をリセット

    if (apiKey) {
      document.getElementById('drop-prog-fill').style.width  = '100%'
      document.getElementById('drop-prog-label').textContent = 'AIが専門用語と本文構造を分析中...'
      addLog('🤖 Gemini APIで専門用語・本文構造を一括抽出中...')

      try {
        const { terms, annotationIndices } = await fetchTermDictionary(sentences, fullText, apiKey)
        termDictionary = terms
        const termCount = Object.keys(termDictionary).length

        if (annotationIndices) {
          // AIの判定で上書き（レイアウト判定より精度が高い）
          let aiCount = 0
          for (const idx of annotationIndices) {
            if (sentences[idx]) {
              sentences[idx].type = 'annotation'
              sentences[idx].source = 'ai'
              aiCount++
            }
          }
          renderTextPanel()
          addLog(`📚 用語辞書構築完了: ${termCount}語を抽出 / 注釈${aiCount}件をAI判定`)
        } else {
          addLog(`📚 用語辞書構築完了: ${termCount}語を抽出`)
        }
      } catch (e) {
        showAlert('AI解析エラー: ' + e.message, 'warn')
        addLog('⚠ 用語抽出に失敗（TTS読み上げのみで続行）')
      }
    } else {
      const asideCount = sentences.filter(s => s.type === 'annotation').length
      if (asideCount > 0) addLog(`📐 レイアウト判定で注釈候補${asideCount}件を検出（簡易判定）`)
    }

    // ── UI切り替え ───────────────────────────────────────────────────────
    dz.style.display = 'none'
    document.getElementById('file-bar').style.display           = 'block'
    document.getElementById('file-name-label').textContent      = file.name
    document.getElementById('sentence-count-badge').textContent = parsed.length + '文'
    document.getElementById('text-panel').style.display         = 'block'
    document.getElementById('progress-section').style.display   = 'block'
    document.getElementById('progress-bar-fill').style.width    = '0%'
    document.getElementById('prog-label').textContent           = `0 / ${parsed.length} 文`
    document.getElementById('prog-pct').textContent             = '0%'

    document.getElementById('btn-start').disabled = false

    addLog(`✅ ${file.name}（${pageCount}ページ、${parsed.length}文）`)
  } catch (e) {
    showAlert('PDF読み込みエラー: ' + e.message, 'err')
    resetDropZone()
  }
}

function resetDropZone() {
  document.getElementById('drop-idle').style.display    = 'flex'
  document.getElementById('drop-loading').style.display = 'none'
  document.getElementById('drop-prog-fill').style.width = '0%'
  const dz = document.getElementById('drop-zone')
  dz.style.cursor = 'pointer'
  // Re-enable click (was nulled during loading)
  dz.style.pointerEvents = 'auto'
}
